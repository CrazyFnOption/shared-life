name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHARED_EXPENSE_ALLOW_MODEL_CALLS: "0"
      SHARED_EXPENSE_MODEL_CALL_LIMIT: "0"
      SHARED_EXPENSE_ALLOW_PUSH: "0"
      SHARED_EXPENSE_BACKUP_DIR: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: python -m pip install uv==0.10.10
      - run: uv sync --locked
      - run: npm ci --prefix web
      - run: uv run pytest server/tests server/plans/test_service.py tests/integration/test_family_migration.py tests/integration/test_family_admin_migration.py -q
      - run: python3 -m unittest discover -s tests/release -v
      - run: npm test --prefix web
      - run: npm run build --prefix web
